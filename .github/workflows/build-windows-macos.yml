name: build-windows-macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show toolchain
        run: |
          rustc --version
          flutter --version
        shell: bash

      - name: Build Rust core (FFI native lib)
        working-directory: apps/flutter_app/rust
        run: cargo build --release
        shell: bash

      - name: Copy native lib into Flutter runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            DLL=$(find . -path ./apps/flutter_app/build -prune -o -name "remote_link_core.dll" -print 2>/dev/null | head -1)
          else
            DLL=$(find . -path ./apps/flutter_app/build -prune -o -name "libremote_link_core.dylib" -print 2>/dev/null | head -1)
          fi
          set -e
          echo "using: $DLL"
          if [ -z "$DLL" ]; then
            echo "NOT FOUND — searching manually:"
            find . -name "remote_link_core.dll" -o -name "libremote_link_core.dylib" | head
            ls -la apps/flutter_app/rust/target/release/ 2>/dev/null | head
            ls -la target/release/ 2>/dev/null | head
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$DLL" apps/flutter_app/windows/runner/
          else
            cp "$DLL" apps/flutter_app/macos/Runner/
          fi

      - name: Build Flutter release
        working-directory: apps/flutter_app
        run: |
          flutter pub get
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows --release
          else
            flutter build macos --release
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            RELEASE_DIR=apps/flutter_app/build/windows/x64/runner/Release
            cp apps/flutter_app/windows/runner/remote_link_core.dll "$RELEASE_DIR/"
            cd "$RELEASE_DIR"
            tar -a -cf "$GITHUB_WORKSPACE/dist/remote_link_windows_amd64.zip" .
          else
            cd apps/flutter_app/build/macos/Build/Products/Release
            tar -a -cf "$GITHUB_WORKSPACE/dist/remote_link_macos_universal.zip" RemoteLink.app
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remote_link_${{ matrix.os }}
          path: |
            dist/
            apps/flutter_app/build/windows/x64/runner/Release/
            apps/flutter_app/build/macos/Build/Products/Release/RemoteLink.app
          if-no-files-found: warn
