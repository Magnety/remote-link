[workspace]
members = [
  "core/identity",
  "core/discovery",
  "core/signaling",
  "core/connection",
  "core/protocol",
  "core/security",
  "core/storage",
  "core/transfer",
  "signaling-adapters/qq-official",
  "signaling-adapters/onebot",
  "signaling-adapters/mock",
  "apps/flutter_app/rust",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RemoteLink Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = "0.23"
url = "2"
